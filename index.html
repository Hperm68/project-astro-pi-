<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Downloads</title>
  <meta name="description" content="Download all releases and assets." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <div class="logo">⬇️</div>
        <div>
          <div class="title" id="siteTitle">Downloads</div>
          <div class="subtitle" id="siteSubtitle">Loading repo…</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn" id="repoLink" href="#" target="_blank" rel="noreferrer">Repo</a>
        <a class="btn" id="releasesLink" href="#" target="_blank" rel="noreferrer">GitHub Releases</a>
        <button class="btn ghost" id="themeBtn" type="button" title="Toggle theme">🌗</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="row">
        <input id="search" class="input" placeholder="Search releases (tag/title/body)…" />
        <button id="refreshBtn" class="btn primary" type="button">Refresh</button>
      </div>
      <div class="muted small" id="status">Ready.</div>
      <div class="muted small">
        Tip: If your repo has lots of releases, click <b>Load more</b>.
      </div>
    </section>

    <section id="list" class="list"></section>

    <section class="card center">
      <button id="loadMoreBtn" class="btn" type="button">Load more</button>
      <div class="muted small" id="moreHint"></div>
    </section>

    <footer class="footer muted small">
      Built for GitHub Pages • <span id="year"></span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
